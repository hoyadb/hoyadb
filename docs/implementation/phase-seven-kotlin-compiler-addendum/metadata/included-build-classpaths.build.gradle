// CHECK-ONLY mirror of the official @react-native/gradle-plugin:react-native-gradle-plugin main classpaths
// (superset of :shared and :settings-plugin): builtin java-gradle-plugin attributes, libs.versions.toml pins,
// plus KGP's default kotlin-stdlib dependency. Not part of the compiler addendum unless its delta is non-empty.
plugins { id 'java-gradle-plugin' }
configurations.compileClasspath.resolutionStrategy.activateDependencyLocking()
configurations.runtimeClasspath.resolutionStrategy.activateDependencyLocking()
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
    implementation 'com.android.tools.build:gradle:8.12.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.google.guava:guava:31.0.1-jre'
    implementation 'com.squareup:javapoet:1.13.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}
tasks.register('prepareCapture')
