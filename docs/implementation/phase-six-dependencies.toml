[package]
name = "hoyadb-phase-six-dependency-review"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zeroize = "=1.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "661107f6eb5d7477c61be1221744de3ad96c53e7", default-features = false, features = ["bundled-sqlcipher"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "661107f6eb5d7477c61be1221744de3ad96c53e7", default-features = false, features = ["ffi-sqlite-wasm-rs"] }
sqlite-wasm-rs = { version = "=0.6.2", default-features = false, features = ["wasm-bindgen", "sqlcipher"] }
sqlite-wasm-vfs = { version = "=0.3.0", default-features = false, features = ["sahpool"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["DedicatedWorkerGlobalScope"] }
wasm-bindgen-futures = "=0.4.79"
