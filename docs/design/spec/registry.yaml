# docs/design/spec/registry.yaml — hoyadb's single append-only source of allocated ids (TRACE-2).
#
# To allocate a new id: append a new entry with the next free number for that
# prefix. Never reuse or renumber an id, even if the file is later deleted or
# the artifact deprecated — remove the file, but leave the registry entry with
# a comment, or add a `status: removed` sibling artifact per the lifecycle.
#
# Listed in allocation order (the order in which each id was first assigned),
# no gaps. File paths are relative to the formal artifact root, docs/design/
# (ADR-0029), not to this registry file or the repository root.

