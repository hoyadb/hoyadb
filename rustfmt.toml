# SPEC-0030: stable options shared by the workspace and isolated spikes.
edition = "2024"
style_edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"

# Give fields and conditional branches room even when they would fit inline.
struct_lit_width = 0
struct_variant_width = 0
single_line_if_else_max_width = 0
single_line_let_else_max_width = 0
