// Official included build remains unchanged. Extra plugin graph approval is a gate.
pluginManagement { includeBuild('../node_modules/@react-native/gradle-plugin') }
plugins { id('com.facebook.react.settings') }
extensions.configure(com.facebook.react.ReactSettingsExtension) { settings ->
  settings.autolinkLibrariesFromCommand()
}
rootProject.name = 'HoyaConsumer'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
buildCache { local { enabled = false } }
