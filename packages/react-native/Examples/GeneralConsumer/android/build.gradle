buildscript {
  ext {
    // Official RN0.86.3 template levels; build-tools 36.1.0 is the installed release (no SDK download).
    buildToolsVersion = '36.1.0'
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = '27.1.12297006'
    kotlinVersion = '2.1.20'
  }
  repositories { google(); mavenCentral() }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.12.0'
    classpath 'com.facebook.react:react-native-gradle-plugin'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
  }
}
apply plugin: 'com.facebook.react.rootproject'
// The owned activation runner supplies the verified local AAR Maven repository.
allprojects {
  repositories {
    maven { url = uri(providers.gradleProperty('hoyaMavenRepository').get()) }
    google()
    mavenCentral()
  }
}
